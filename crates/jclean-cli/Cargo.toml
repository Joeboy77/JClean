[package]
name = "jclean-cli"
description = "Development and test harness for jclean-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "jclean-cli"
path = "src/main.rs"

[dependencies]
jclean-core = { workspace = true, features = ["test-support"] }
anyhow.workspace = true
serde_json.workspace = true
# Argument parsing for the dev harness only; not part of the app bundle.
clap = { version = "4.6", features = ["derive"] }

[lints]
workspace = true
