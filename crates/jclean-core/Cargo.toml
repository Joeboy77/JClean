[package]
name = "jclean-core"
description = "Scanner, sizing, rules engine, cleaner and safety guard for JClean"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Fixture homes for tests and `jclean-cli fixture`. Never used by the app.
test-support = ["dep:filetime"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
globset = { version = "0.4", default-features = false }
jsonschema = { version = "0.58", default-features = false }
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Windows moves to the Recycle Bin with IFileOperation, which needs COM
# initialised apartment-threaded (spec §8.3); the feature does nothing elsewhere.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
filetime = { version = "0.2", optional = true }

# Allocated sizes and hard-link identity on Windows (spec §4.2). Already in
# the app's dependency tree through Tauri, so it adds no size.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Enables `testing` (fixture homes) for this crate's own integration tests.
jclean-core = { path = ".", features = ["test-support"] }
filetime = "0.2"
proptest = "1.11"
tempfile = "3.27"

[lints]
workspace = true
