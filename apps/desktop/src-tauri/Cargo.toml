[package]
name = "jclean-desktop"
description = "JClean desktop app shell: commands, events, tray, updater"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "jclean_desktop"

[[bin]]
name = "jclean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
jclean-core.workspace = true
serde.workspace = true
tauri = { version = "2.12", features = [] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[lints]
workspace = true
