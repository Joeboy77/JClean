[package]
name = "jclean-desktop"
description = "JClean desktop app shell: commands, events, tray, updater"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "jclean_desktop"

[[bin]]
name = "jclean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
jclean-core.workspace = true
serde_json.workspace = true
serde.workspace = true
# tray-icon + image-png: the menu bar icon (spec §5.10).
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# Official Tauri plugins:
# window-state remembers size and position (spec §5.1); autostart is launch
# at login (spec §11); dialog picks custom folders and rule packs (spec §6.4);
# opener reveals items in Finder and opens System Settings (spec §5.2, §11).
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
# Signed auto-updates from GitHub Releases, and relaunching after one (spec §14).
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"

# Native animated window resize for compact/expanded switching (spec §5.8).
# Already in the dependency tree through Tauri, so this adds no size.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }

# Disk capacity on Windows (spec §4.3). Already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# Disk capacity on Linux (spec §4.3). Already in the tree through Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
