name: Release

# Pushing a tag like v1.0.0 builds the Mac, Windows and Linux apps, signs
# their update packages, and publishes a release (spec §14).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal build
    runs-on: macos-latest
    outputs:
      release-id: ${{ steps.build.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches the app version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi

      # Signing and notarization happen only when the Apple secrets exist.
      # A missing secret still reaches the build as an empty variable, and
      # Tauri then tries to import an empty certificate, so only non-empty
      # values are passed on. Without them the app is ad-hoc signed and the
      # release notes explain Gatekeeper's "Open Anyway".
      - name: Use Apple signing only when it's set up
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="END_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done

      # Update packages are always signed.
      - name: Build and upload (draft)
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: JClean ${{ github.ref_name }}
          releaseBody: |
            ## Download

            - **Mac: [JClean_macos_universal.dmg](https://github.com/Joeboy77/JClean/releases/latest/download/JClean_macos_universal.dmg)**. Apple Silicon and Intel, macOS 12 or later.
            - **Windows: [JClean_windows_x64_setup.exe](https://github.com/Joeboy77/JClean/releases/latest/download/JClean_windows_x64_setup.exe)**. Windows 10 or 11, 64-bit. Installs for your account only, no administrator needed.
            - **Linux: [JClean_linux_x86_64.AppImage](https://github.com/Joeboy77/JClean/releases/latest/download/JClean_linux_x86_64.AppImage)** for any distribution (make it executable, then run it), or **[JClean_linux_amd64.deb](https://github.com/Joeboy77/JClean/releases/latest/download/JClean_linux_amd64.deb)** for Ubuntu, Debian and Mint. 64-bit.

            Checksums are in `SHA256SUMS.txt`.

            ## Opening JClean the first time on a Mac

            This version isn't notarized by Apple yet, so macOS asks you to confirm once:

            1. Open the DMG and drag **JClean** into **Applications**.
            2. Open JClean. macOS says it can't verify the app. Click **Done** (not "Move to Trash").
            3. Open **System Settings → Privacy & Security**, scroll down to "JClean was blocked to protect your Mac", and click **Open Anyway**. Confirm with your password.
            4. JClean opens. From now on it opens normally.

            ## Installing on Windows

            The installer isn't code-signed yet, so Windows SmartScreen may say it "protected your PC". Click **More info**, then **Run anyway**. You only see this when installing; updates install from inside JClean.

            JClean is open source, reads only file sizes and dates, and never sends anything off your computer.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      # Stable names mean the website's download link never changes
      # (spec §12.2): /releases/latest/download/JClean_macos_universal.dmg.
      - name: Upload the DMG under its stable name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)" JClean_macos_universal.dmg
          gh release upload "$GITHUB_REF_NAME" JClean_macos_universal.dmg --clobber

  # After the Mac build, so the two never race to update latest.json.
  windows:
    name: Windows x64 build
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Adds the Windows installer and its update package to the same draft.
      - name: Build and upload (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.macos.outputs.release-id }}
          includeUpdaterJson: true

      # /releases/latest/download/JClean_windows_x64_setup.exe (spec §14).
      - name: Upload the installer under its stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)" JClean_windows_x64_setup.exe
          gh release upload "$GITHUB_REF_NAME" JClean_windows_x64_setup.exe --clobber

  # After Windows, for the same reason: one job at a time updates latest.json.
  linux:
    name: Linux x64 build
    needs: [macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Adds the AppImage and .deb, and their update packages, to the draft.
      - name: Build and upload (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.macos.outputs.release-id }}
          includeUpdaterJson: true

      - name: Upload the Linux packages under their stable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$(ls target/release/bundle/appimage/*.AppImage | head -n 1)" JClean_linux_x86_64.AppImage
          cp "$(ls target/release/bundle/deb/*.deb | head -n 1)" JClean_linux_amd64.deb
          gh release upload "$GITHUB_REF_NAME" JClean_linux_x86_64.AppImage JClean_linux_amd64.deb --clobber

  publish:
    name: Checksums and publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="JClean_macos_universal.dmg JClean_windows_x64_setup.exe JClean_linux_x86_64.AppImage JClean_linux_amd64.deb"
          for f in $files; do gh release download "$GITHUB_REF_NAME" -p "$f"; done
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Rebuild the website
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -X POST "$DEPLOY_HOOK"; else echo "No deploy hook configured."; fi
