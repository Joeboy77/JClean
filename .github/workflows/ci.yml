name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint and format
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      # The website reads the latest release from GitHub at build time.
      - name: Frontend build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: IPC bindings are up to date
        run: git diff --exit-code apps/desktop/src/bindings.ts

  windows:
    name: Rust lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri embeds the built frontend, so it has to exist to compile.
      - name: Frontend build
        run: pnpm --filter desktop build

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      # Runs natively, so junctions, NTFS sizes and hard links are real.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude jclean-desktop --no-fail-fast 2>&1 | tee test-output.txt
          # A Tauri test binary can't start on Windows without the app's
          # manifest, and its one test (the IPC bindings) runs on macOS, so
          # here it only has to compile.
          cargo test -p jclean-desktop --no-run 2>&1 | tee -a test-output.txt

      # Puts failures on the run's summary page, where they're readable
      # without opening the log.
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E -A6 "panicked at|^error(\[E[0-9]+\])?:" test-output.txt | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Rust test failures on Windows::${summary}"

  linux:
    name: Rust lint and test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # What Tauri needs to build on Linux, plus the tray's indicator library.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm --filter desktop build

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      - name: Summarize test failures
        if: failure()
        run: |
          summary=$(grep -E -A6 "panicked at|^error(\[E[0-9]+\])?:" test-output.txt | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Rust test failures on Linux::${summary}"
