[workspace]
resolver = "3"
members = ["crates/jclean-core", "crates/jclean-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Joeboy77/JClean"

[workspace.dependencies]
jclean-core = { path = "crates/jclean-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Keep debug builds small: line tables for our code, no debug info for
# dependencies. Full debug info for Tauri's tree is several gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The engine walks millions of files; unoptimized it makes dev scans crawl.
[profile.dev.package.jclean-core]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
